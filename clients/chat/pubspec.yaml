name: companion_chat
description: Private multi-Bot chat for Android and Windows.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.5.0
  drift: 2.35.4
  go_router: 18.1.4
  dio: 5.11.1
  web_socket_channel: 3.0.3
  flutter_secure_storage: 11.2.0
  cryptography: 2.9.0
  path_provider: 2.1.6
  path: 1.9.1
  flutter_driver:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.3
  build_runner: 2.17.1
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
