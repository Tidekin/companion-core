name: Compose diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            mode: ready-pytest
            args: --pytest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      COMPOSE_DIAGNOSTIC_PREINITIALIZED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-3.12
      - run: uv sync --frozen --extra onebot
      - name: Initialize native Docker Compose plugin
        timeout-minutes: 2
        run: docker compose version --short
      - name: Inspect native Compose without starting containers
        run: uv run --frozen --extra onebot python -B scripts/diagnose_compose.py ${{ matrix.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: compose-diagnostic-${{ matrix.os }}-${{ matrix.mode }}-${{ github.run_attempt }}
          path: .local/compose-diagnostic/*.json*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
