name: Install pgvector for the runner PostgreSQL server
description: Build the pinned extension against the same native binaries used by CI
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: pgvector/pgvector
        ref: f37c13f68b57d2c3472b2214fbcff699d6d34876 # v0.8.7
        path: .local/ci-pgvector
        persist-credentials: false
    - if: runner.os == 'Linux'
      shell: bash
      working-directory: .local/ci-pgvector
      run: |
        if [[ ! -f "$(pg_config --includedir-server)/postgres.h" ]]; then
          major=$(pg_config --version | awk '{print $2}' | cut -d. -f1)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "postgresql-server-dev-$major"
        fi
        make -j2 OPTFLAGS="" with_llvm=no
        sudo make install with_llvm=no
    - if: runner.os == 'Windows'
      shell: cmd
      working-directory: .local/ci-pgvector
      run: |
        for %%i in ("%PGBIN%\..") do set "PGROOT=%%~fi"
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
        call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
        if errorlevel 1 exit /b 1
        nmake /nologo /F Makefile.win install
