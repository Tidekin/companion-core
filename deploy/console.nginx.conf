# Example: one TLS reverse proxy on the same host as Core.
# Replace domain/certificate paths; keep the Core socket off the public network.
server {
    listen 443 ssl;
    server_name console.example.test;
    ssl_certificate /etc/letsencrypt/live/console.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.test/privkey.pem;

    # Discard any client-supplied forwarding chain at this single proxy boundary.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /console {
        include /etc/nginx/console-static-headers.conf;
        return 308 /console/;
    }
    location /console/ {
        include /etc/nginx/console-static-headers.conf;
        proxy_pass http://127.0.0.1:8765;
    }
    location /_console_assets/ {
        internal;
        include /etc/nginx/console-static-headers.conf;
        # Core selects one fixed asset after its enabled/credential checks.
        # This loopback-only backend has no Core network or credentials.
        proxy_pass http://127.0.0.1:8766/;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host console-static;
        proxy_ignore_headers X-Accel-Redirect;
    }
    # Avatar originals (up to 5 MiB, base64 in JSON); Core checks the decoded bytes again.
    location = /v1/console/chat/profile/avatars {
        client_max_body_size 8m;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_pass http://127.0.0.1:8765;
    }
    location /v1/console/ {
        proxy_ignore_headers X-Accel-Redirect;
        proxy_pass http://127.0.0.1:8765;
    }
    location / { return 404; }
}
