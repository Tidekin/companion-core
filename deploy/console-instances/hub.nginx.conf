# Hub TLS virtual host only. The entry URL redirects into the owner cookie's path.
location = /v1/console/instances/index.html {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /v1/console/overview;
    error_page 401 403 /instances/login.html;
    alias "/srv/companion-instances/index.html";
    default_type text/html;
    charset utf-8;
    include "/srv/companion-instances/headers.conf";
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; frame-src 'self' https://peer.example.test; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
}
location = /instances/login.html {
    internal;
    alias "/srv/companion-instances/login.html";
    default_type text/html;
    charset utf-8;
    include "/srv/companion-instances/headers.conf";
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
}
