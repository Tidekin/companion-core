# Both TLS virtual hosts. This exact document is the only frameable page.
location = /instances/ { return 302 https://hub.example.test/v1/console/instances/index.html; }
location = /instances/card.html {
    alias "/srv/companion-instances/card.html";
    default_type text/html;
    charset utf-8;
    include "/srv/companion-instances/headers.conf";
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors https://hub.example.test; form-action 'none'; base-uri 'none'" always;
}
location ^~ /instances/assets/ {
    alias "/srv/companion-instances/assets/";
    types { text/css css; application/javascript js; }
    include "/srv/companion-instances/headers.conf";
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
